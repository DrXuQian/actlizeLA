[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actlize-la"
dynamic = ["version"]
description = "Forward linear attention with independent CUDA SM80, Hopper SM90 and PPU backends"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "actlizeLA contributors" }]
# Torch/runtime are supplied by the platform. Installing an operator wheel must
# not pull an unrelated NVIDIA Torch/CUDA distribution onto a PPU machine.
dependencies = []

[project.optional-dependencies]
test = ["pytest", "numpy"]
benchmark = ["matplotlib", "pandas"]

[tool.setuptools.packages.find]
where = ["."]
include = ["actlize_la*"]

[tool.setuptools.dynamic]
version = {attr = "actlize_la._version.__version__"}

[tool.setuptools.package-data]
"actlize_la" = ["sm90_policy.json"]
"actlize_la.backends" = ["targets.json"]

[tool.setuptools.exclude-package-data]
"actlize_la" = ["_sm90_bundle.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
